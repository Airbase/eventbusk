[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eventbusk"
version = "0.1.6"
description = "Event bus framework(with Kafka support)"
authors = [{name = "Airbase Inc", email = "developers@airbase.io"}]
requires-python = ">=3.13"
dependencies = [
    "click>=8",
    "confluent-kafka>=2.3.0",
    "cotyledon>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3",
    "pre-commit>=4.6",
    "pylint>=4.0",
    "pytest-cov>=7.1",
    "pytest-mock>=3.15",
    "pytest-socket>=0.7",
    "pytest-xdist>=3.8",
    "pytest>=9.0",
    "ruff>=0.16",
    "taskipy>=1.14",
]

[project.scripts]
eventbusk = "eventbusk.cli:cli"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflicting rules
    "D203",    # blank-line-before-class: conflicts with D211
    "D213",    # multi-line-summary-second-line: conflicts with D212

    # Docstring style (too opinionated / would add boilerplate)
    "D102",    # undocumented-public-method
    "D104",    # undocumented-public-package
    "D105",    # undocumented-magic-method
    "D107",    # undocumented-public-init
    "D205",    # missing-blank-line-after-summary
    "D401",    # non-imperative-mood
    "D402",    # signature-in-docstring

    # Exception message style (opinionated)
    "TRY003",  # raise-vanilla-args: long messages outside exception class
    "TRY004",  # type-check-without-type-error
    "EM101",   # raw-string-in-exception: assigning to msg variable first
    "EM102",   # f-string-in-exception: assigning to msg variable first

    # Conflicts with the ruff formatter
    "COM812",  # missing-trailing-comma (formatter handles this)

    # Logging style (project consistently uses f-strings)
    "G004",    # logging-f-string
    "G202",    # logging-redundant-exc-info (intentional in except blocks)

    # TODO annotations (intentional TODOs exist in codebase)
    "FIX002",  # line-contains-todo
    "TD002",   # missing-todo-author
    "TD003",   # missing-todo-link

    # Type annotation permissiveness
    "ANN401",  # any-type (needed for *args/**kwargs)
    "ANN001",  # missing-type-function-argument (covered by mypy)
    "ANN201",  # missing-return-type-undocumented-public-function (covered by mypy)

    # Complexity metrics (require refactoring, not linting fixes)
    "C901",    # complex-structure
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements

    # Test patterns that are intentional
    "SLF001",  # private-member-access (legitimate for testing internals)
    "PLR2004", # magic-value-comparison (well-known constants like port 9092)
    "PT028",   # pytest-parameter-with-default-argument
    "PT011",   # pytest-raises-too-broad

    # blanket type: ignore (third-party libs without stubs)
    "PGH003",  # blanket-type-ignore

    # Commented-out code used as intentional documentation
    "ERA001",  # commented-out-code

    # Would break public API to rename
    "N818",    # error-suffix-on-exception-name (UnknownEvent, AlreadyRegistered)

    # examples/ is not a package
    "INP001",  # implicit-namespace-package

    # Misc
    "ARG001",  # unused-function-argument (interface methods, test event handlers)
    "ARG002",  # unused-method-argument (interface methods)
    "B024",    # abstract-base-class-without-abstract-method
    "CPY001",  # missing-copyright-notice
    "LOG014",  # exc-info-outside-except-handler
    "S105",    # hardcoded-password-string (test assertion, not real password)
    "TID252",  # relative-imports (used throughout the package)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # assert: fine in tests
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
files = ["eventbusk"]
allow_redefinition = false
allow_redefinition_old = false
allow_untyped_globals = false
check_untyped_defs = true
color_output = true
disallow_any_decorated = true
disallow_any_explicit = false
disallow_any_expr = false
disallow_any_generics = false
disallow_any_unimported = false
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = false
follow_imports = "normal"
follow_imports_for_stubs = true
follow_untyped_imports = false
ignore_errors = false
ignore_missing_imports = false
implicit_reexport = false
local_partial_types = false
no_implicit_optional = false
no_strict_bytes = false
pretty = true
report_deprecated_as_note = false
show_column_numbers = true
show_error_code_links = false
show_error_codes = true
show_error_context = true
show_error_end = false
strict_equality = true
strict_equality_for_none = false
strict_optional = true
verbosity = 0
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cotyledon", "cotyledon.*"]
ignore_missing_imports = true

[tool.pylint.master]
bad-functions = ["print"]
jobs = 1
max-complexity = 10

[tool.pylint.format]
max-line-length = 88
max-module-lines = 1000
single-line-class-stmt = "no"
single-line-if-stmt = "no"

[tool.pylint.design]
max-args = 6
max-positional-arguments = 3
max-attributes = 7
max-bool-expr = 5
max-branches = 15
max-locals = 15
max-parents = 7
max-public-methods = 20
max-returns = 6
max-statements = 60
min-public-methods = 1

[tool.pylint.refactoring]
max-nested-blocks = 5

[tool.pylint.similarities]
min-similarity-lines = 15

[tool.pylint.messages_control]
disable = [
    "fixme",
    "logging-fstring-interpolation",
]

[tool.pylint.reports]
output-format = "colorized"
score = "yes"

[tool.pytest.ini_options]
addopts = "--disable-socket"

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "*/tests/*",
    "./docs/*",
    ]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    ]
ignore_errors = true
precision = 2
skip_empty = true
skip_covered = true
show_missing = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.taskipy.tasks]
typecheck = "mypy"
pylint = "pylint --extension-pkg-whitelist=confluent_kafka --load-plugins=pylint.extensions.bad_builtin --load-plugins=pylint.extensions.mccabe eventbusk tests"
lint = "ruff check"
format = "ruff format"
test = "pytest --cov=. --cov-config=pyproject.toml --no-cov-on-fail"
coverage = "coverage report --rcfile=pyproject.toml"
coverage_report = "coverage report --rcfile=pyproject.toml"
coverage_html = "coverage html --rcfile=pyproject.toml"
